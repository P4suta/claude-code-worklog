name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Workflow and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - name: Validate selection output
        env:
          CODE_FILTER: ${{ steps.changes.outputs.code }}
        run: |
          case "$CODE_FILTER" in
            true|false) ;;
            *) exit 1 ;;
          esac
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: actionlint@1.7.12,typos-cli@1.51.1,committed@1.1.11
      - run: actionlint
      - run: typos
      - name: Check Conventional Commits
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" | xargs -rn1 committed

  verify:
    name: Rust lint and dependency assurance
    needs: [quality]
    if: needs.quality.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0,cargo-deny@0.20.2,cargo-machete@0.9.2,typos-cli@1.51.1
      - run: just lint

  test:
    name: Native tests (${{ matrix.os }})
    needs: [quality]
    if: needs.quality.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
      - run: just test

  msrv:
    name: Rust 1.95 compatibility
    needs: [quality]
    if: needs.quality.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - run: cargo check --locked --workspace --all-targets

  required:
    name: required
    if: always()
    needs: [quality, verify, test, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every selected result
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE_SELECTED: ${{ needs.quality.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          jq -e --arg code "$CODE_SELECTED" --arg event "$EVENT_NAME" '
            ($code == "true" or $code == "false") and
            .quality.result == "success" and
            (.verify.result == (if $code == "true" or $event == "workflow_dispatch"
              then "success" else "skipped" end)) and
            (.test.result == (if $code == "true" or $event == "workflow_dispatch"
              then "success" else "skipped" end)) and
            (.msrv.result == (if $code == "true" or $event == "workflow_dispatch"
              then "success" else "skipped" end))
            ' <<< "$RESULTS"
